<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UFT-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Elementos</title>
        <style>
            .container {
                width: 50vw;
                border: 2px solid #000;
                padding: 15px;
                word-break:keep-all;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-size: clamp(12px, 20px, 40px);
                background: #1b1d2f;
                color: #fff;
                border-radius: 20px;
            }
            .container h1 {
                color: #fff;
                border-bottom: 1px solid;
                text-align: center;
            }
            .dot-contain {
                display: flex;
                text-align: center;
                gap: 5px;
            }
            .dot {
                width: 20px;
                height: 20px;
                border-radius: 50%;
                background-color: #c7210b;
            }
            .dot2 {
                width: 20px;
                height: 20px;
                border-radius: 50%;
                background-color: #dac315;
            }
            .dot3 {
                width: 20px;
                height: 20px;
                border-radius: 50%;
                background-color: #1bc70b;
            }
        </style>
    </head>
    <body>
        
        <div class="container">
            <div class="dot-contain">
                <div class="dot"></div>
                <div class="dot2"></div>
                <div class="dot3"></div>
            </div>
            
            <h1>Elementos HTML</h1>
            <p>
                Elementos html son todo lo que se abarca entre las etiquetas, incluyendo a estas.
            </p>
        </div>
    </body>
</html>
